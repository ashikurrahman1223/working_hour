<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Work Hours Log</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-bg" aria-hidden="true"></div>

  <header class="topbar no-print">
    <div class="brand">
      <span class="brand-mark">H</span>
      <div>
        <p class="brand-name">Razib Hossain Hours Log</p>
        <p class="brand-sub">Work hours timesheet</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button type="button" class="btn btn-ghost" id="btn-clear">Clear</button>
      <button type="button" class="btn btn-primary" id="btn-print">Print</button>
    </div>
  </header>

  <main class="sheet" id="sheet">
    <section class="sheet-header">
      <div class="header-fields">
        <label class="field name-field">
          <span>Name</span>
          <input type="text" id="worker-name" placeholder="Worker name" autocomplete="name" />
        </label>
        <label class="field">
          <span>From</span>
          <input type="date" id="date-from" />
        </label>
        <label class="field">
          <span>To</span>
          <input type="date" id="date-to" />
        </label>
        <label class="field rate-field no-print">
          <span>Rate /hr</span>
          <input type="number" id="hourly-rate" min="0" step="0.01" placeholder="0.00" />
        </label>
      </div>
      <p class="period-label" id="period-label"></p>
    </section>

    <section class="tables-wrap">
      <div class="day-tables" id="day-tables">
        <!-- filled by JS -->
      </div>
    </section>

    <section class="expenses-section">
      <div class="section-head">
        <h2>Expenses</h2>
        <button type="button" class="btn btn-small no-print" id="btn-add-expense">+ Add</button>
      </div>
      <table class="expense-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th>Amount</th>
            <th class="no-print"></th>
          </tr>
        </thead>
        <tbody id="expense-body"></tbody>
      </table>
    </section>

    <section class="summary-section">
      <div class="summary-grid">
        <div class="summary-row">
          <span class="summary-label">Total Days</span>
          <strong id="total-days">0</strong>
        </div>
        <div class="summary-row">
          <span class="summary-label">Total Hours</span>
          <strong id="total-hours">0.00</strong>
        </div>
        <div class="summary-row">
          <span class="summary-label">Total Advance</span>
          <input type="number" id="total-advance" min="0" step="0.01" value="0" />
        </div>
        <div class="summary-row">
          <span class="summary-label">Total Amount</span>
          <strong id="total-amount">$0.00</strong>
        </div>
        <div class="summary-row">
          <span class="summary-label">Expenses</span>
          <strong id="total-expenses">$0.00</strong>
        </div>
        <div class="summary-row highlight">
          <span class="summary-label">Sub Total</span>
          <strong id="sub-total">$0.00</strong>
        </div>
        <div class="summary-row signature-row">
          <span class="summary-label">Worker's Signature</span>
          <input type="text" id="worker-signature" placeholder="Sign here" />
        </div>
      </div>
    </section>
  </main>

  <footer class="page-footer no-print">
    <p>Hours = end − start − break. Mark OFF days to skip them. Print for a clean paper copy.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
